<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أسواق SAHM</title><style>body{margin:0;background:#eff3f7;font:16px system-ui;color:#173449}.login{max-width:420px;margin:9vh auto;padding:24px;background:white;border-radius:18px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit;border-radius:10px;border:1px solid #ccd5df}button{background:#173449;color:white}iframe{width:100%;min-height:100vh;border:0}#logout{width:auto;float:left;margin:10px}#error{color:#a52828;white-space:pre-wrap}h1{font-size:25px}</style><section id="login" class="login"><h1>حيّاك في أسواق SAHM</h1><p>ادخل بالحساب اللي أعطاك إياه مدير المنظومة.</p><form id="signin"><input id="email" type="email" autocomplete="username" placeholder="البريد الإلكتروني" aria-label="البريد الإلكتروني" required><input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور" required><button id="submit">دخول الأسواق</button></form><p id="error" role="status"></p></section><section id="market" hidden><button id="logout">خروج</button><iframe id="report" title="تحليل الأسهم"></iframe></section><script>const DOC="\u003c!doctype html>\u003chtml lang=\"ar\" dir=\"rtl\">\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>SAHM | تحليل السهم من كل الجهات\u003c/title>\u003cstyle>\n:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#09121b;color:#e6edf4;font:16px system-ui}main{max-width:1160px;margin:auto;padding:35px 22px}h1{font-size:34px;margin:12px 0}h2{font-size:20px}p,.muted{color:#aabacb;line-height:1.8}header{border-bottom:1px solid #2a3c4e;padding-bottom:25px}.brand{color:#69dcc3;letter-spacing:3px}form{display:flex;gap:12px;max-width:520px;margin:24px 0}input,button{font:inherit;border-radius:10px;padding:14px;border:1px solid #3d576f}input{background:#142332;color:white;width:100%}button{background:#69dcc3;color:#08211c;cursor:pointer;white-space:nowrap}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{min-width:0;background:#12202d;border:1px solid #273d50;border-radius:15px;padding:21px;margin:16px 0}.metric b{display:block;font-size:24px;margin-top:10px}.pill{color:#f5d888}.wide{grid-column:1/-1}li{line-height:1.9}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:12px;border-bottom:1px solid #2a3c4e}a{color:#69dcc3}svg{width:100%;height:300px}details{margin-top:16px}#error{color:#ffc0b8}small{color:#aabacb} @media(max-width:700px){.grid{grid-template-columns:minmax(0,1fr)}h1{font-size:27px}main{padding:20px 14px}form{flex-wrap:wrap}button{width:100%}}\n@media(max-width:700px){table{display:block;max-width:100%;overflow-x:auto;font-size:13px}th,td{padding:10px;min-width:88px}.card{padding:15px;margin:10px 0}input{min-width:0;margin-bottom:8px}details>div[style]{flex-wrap:wrap}h2{font-size:18px}svg{height:230px}svg text{font-size:30px;direction:ltr}summary{line-height:1.7;cursor:pointer}small{overflow-wrap:anywhere}button,input{min-height:46px}body{overflow-x:hidden}} \u003c/style>\u003cmain>\u003cheader>\u003cdiv class=\"brand\">SAHM / RESEARCH\u003c/div>\u003ch1>تحليل السهم من كل الجهات\u003c/h1>\u003cp>شوف الشارت، وضع الشركة والسيولة في مكان واحد. كل معلومة معها تاريخها، والناقص نوضحه لك.\u003c/p>\u003ca href=\"/markets.html\" target=\"_top\">صفحة الأسواق\u003c/a>\u003cform id=\"form\">\u003cinput id=\"symbol\" aria-label=\"رمز السهم\" placeholder=\"اكتب رمز السهم، مثل 2222\" pattern=\"[0-9]{4,6}\" required inputmode=\"numeric\">\u003cbutton id=\"go\">حلّل السهم\u003c/button>\u003c/form>\u003cdiv id=\"error\" role=\"status\">\u003c/div>\u003c/header>\u003cdetails class=\"card\">\u003csummary>أدوات باقتك — قارن وراجع الإعلانات\u003c/summary>\u003cp>باقتك تعطينا قوائم سنوية. الأخبار نراجعها يدويًا؛ إذا ما وصلنا خبر، ما يعني إنه ما فيه أخبار.\u003c/p>\u003cdiv style=\"display:flex;gap:12px\">\u003cinput id=\"peer\" aria-label=\"رمز شركة المقارنة\" placeholder=\"رمز شركة أخرى من القطاع نفسه\" inputmode=\"numeric\">\u003cbutton type=\"button\" id=\"compare\">قارن الشركتين\u003c/button>\u003c/div>\u003cdiv id=\"comparison\" role=\"status\">\u003c/div>\u003ch2>سجل مراجعة الإعلانات\u003c/h2>\u003cp>ملاحظاتك محفوظة على هالمتصفح فقط. ما تدخل في التقييم الآلي، وما تنعرض للعملاء.\u003c/p>\u003cinput id=\"newsTitle\" aria-label=\"عنوان الإعلان\" placeholder=\"عنوان الإعلان\">\u003cinput id=\"newsUrl\" aria-label=\"رابط الإعلان الرسمي\" placeholder=\"رابط الإعلان الأصلي https://\">\u003cinput id=\"newsDate\" aria-label=\"تاريخ الإعلان\" type=\"date\">\u003cbutton type=\"button\" id=\"saveNews\">حفظ مراجعة الإعلان\u003c/button>\u003cdiv id=\"newsNotes\">\u003c/div>\u003cp id=\"planUsage\">\u003c/p>\u003c/details>\u003csection id=\"out\" aria-live=\"polite\">\u003cdiv class=\"card\">\u003ch2>أي سهم تبي نحلّل؟\u003c/h2>\u003cp>اكتب رمز الشركة فوق واضغط «حلّل السهم». النتيجة من بيانات السوق الفعلية.\u003c/p>\u003c/div>\u003c/section>\u003c/main>\u003cscript>window.SAHM_SERVICE_URL=\"https://uwwuchwivroukskddkhq.supabase.co/functions/v1/sahm-engine\";\nlet sahmToken=null;\nconst authReady=new Promise(resolve=>{window.addEventListener('message',e=>{if(e.origin!=='https://nezam.mrrsal.com'||e.source!==parent||e.data?.type!=='SAHM_AUTH'||typeof e.data.token!=='string')return;sahmToken=e.data.token;resolve();});if(parent!==window)parent.postMessage({type:'SAHM_AUTH_REQUEST'},'https://nezam.mrrsal.com');});\nconst nativeFetch=window.fetch.bind(window);\nasync function securedFetch(url,options={}){await Promise.race([authReady,new Promise((_,reject)=>setTimeout(()=>reject(Error('افتح الأسواق من حسابك في المنظومة أولًا.')),8000))]);return nativeFetch(window.SAHM_SERVICE_URL+url,{...options,headers:{...options.headers,Authorization:'Bearer '+sahmToken,apikey:'sb_publishable_nq98s8SPKegEmVrYcD9ewA_jEuYA7yh'}});}\n\nconst E=s=>String(s??'—').replace(/[&\u003c>\"']/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst N=n=>n===null||n===undefined?'غير متاح':Number(n).toLocaleString('en-US',{maximumFractionDigits:2});\nconst pct=n=>n==null?'غير متاح':N(n)+'%';\nconst billion=n=>n==null?'غير متاح':N(n/1e9)+' مليار ريال';\nconst metrics=items=>items.map(([k,v])=>`\u003cdiv class=\"card metric\">\u003csmall>${E(k)}\u003c/small>\u003cb>${E(v)}\u003c/b>\u003c/div>`).join('');\nconst list=xs=>'\u003cul>'+xs.map(x=>'\u003cli>'+E(x)+'\u003c/li>').join('')+'\u003c/ul>';\nfunction chart(rows){const lo=Math.min(...rows.map(r=>r.low)),hi=Math.max(...rows.map(r=>r.high));const y=v=>260-(v-lo)/(hi-lo||1)*230;return `\u003csvg dir=\"ltr\" style=\"direction:ltr\" viewBox=\"0 0 1000 300\" role=\"img\" aria-label=\"شموع آخر120 جلسة على أساس أسعار معدلة متسق\">\u003ctext x=\"8\" y=\"18\" fill=\"#aabacb\">${N(hi)}\u003c/text>\u003ctext x=\"8\" y=\"282\" fill=\"#aabacb\">${N(lo)}\u003c/text>${rows.map((r,i)=>{let x=60+i*7.5,c=r.close>=r.open?'#69dcc3':'#f49388';return `\u003cline x1=\"${x}\" x2=\"${x}\" y1=\"${y(r.high)}\" y2=\"${y(r.low)}\" stroke=\"${c}\"/>\u003crect x=\"${x-2.5}\" y=\"${Math.min(y(r.open),y(r.close))}\" width=\"5\" height=\"${Math.max(1,Math.abs(y(r.open)-y(r.close)))}\" fill=\"${c}\"/>`}).join('')}\u003ctext x=\"60\" y=\"298\" fill=\"#aabacb\">${E(rows[0].date)}\u003c/text>\u003ctext x=\"850\" y=\"298\" fill=\"#aabacb\">${E(rows.at(-1).date)}\u003c/text>\u003c/svg>`}\nfunction render(d){let t=d.technical,f=d.financials,v=d.fundamentals,div=d.dividends;let news=d.sources.events.status==='available'?list(d.events.map(x=>(x.event_date||x.article_date||'')+' — '+x.description)): '\u003cp>الأخبار الآلية مو ضمن باقتك، لذلك ما دخلت في التقييم. راجع إعلانات الشركة قبل القرار.\u003c/p>';let site='';try{let u=new URL(d.official_company_website);if(u.protocol==='https:')site=`\u003ca target=\"_blank\" rel=\"noopener noreferrer\" href=\"${E(u.href)}\">موقع الشركة الرسمي — مراجعة الإعلانات والنتائج\u003c/a>`}catch{}\n document.querySelector('#out').innerHTML=`\u003cdiv class=\"card\">\u003csmall>${E(d.sector)} · ${E(d.symbol)}\u003c/small>\u003ch1>${E(d.name)}\u003c/h1>\u003ch2 class=\"pill\">${E(d.verdict)}\u003c/h2>\u003cp>${E(d.summary)}\u003c/p>\u003csmall>آخر شمعة مكتملة ${E(d.as_of)} · جُلب التقرير ${E(d.generated_at)} · ${d.cached?'نسخة محفوظة حتى5 دقائق':'جلب جديد'} · المصدر SAHMK\u003c/small>\u003cp>المعلومات اللي ناقصة: ${E(d.missing_sections.map(x=>({events:'الأخبار',financials:'القوائم',company:'الشركة',dividends:'التوزيعات',market:'المؤشر',income_statement:'قائمة الدخل',stale_financials:'قوائم قديمة'}[x]||x)).join('، ')||'لا توجد أقسام مفقودة من المسارات المطلوبة')}.\u003c/p>\u003c/div>\u003cdiv class=\"grid\">${metrics([['الاتجاه',t.trend],['آخر شمعة',d.candle],['الدرجة الفنية الوصفية',t.score+' / 100 — ليست احتمال نجاح'],['الدعم',N(t.support)],['المقاومة',N(t.resistance)],['الحجم النسبي',N(t.indicators.relative_volume)+'x']])}\u003cdiv class=\"card wide\">\u003ch2>شارت120 جلسة\u003c/h2>${chart(d.chart)}\u003csmall>الشموع على أساس تعديل متسق؛ لم تُطابق إجراءات الشركات مستقلًا.\u003c/small>\u003c/div>\u003cdiv class=\"card wide\">\u003ch2>الدخول والوقف والأهداف — للمراجعة\u003c/h2>\u003cp>${E(d.plan_label)}\u003c/p>\u003ctable>\u003ctr>\u003cth>الدخول\u003c/th>\u003cth>الوقف\u003c/th>\u003cth>الأهداف\u003c/th>\u003cth>العائد/المخاطرة\u003c/th>\u003c/tr>\u003ctr>\u003ctd>${N(t.entry.low)} – ${N(t.entry.high)}\u003c/td>\u003ctd>${N(t.stop)}\u003c/td>\u003ctd>${t.targets.map(N).join(' / ')}\u003c/td>\u003ctd>${N(t.risk_reward)}R\u003c/td>\u003c/tr>\u003c/table>\u003cp>كسر الوقف يبطل هذه الخطة الحسابية. المستويات مأخوذة من نموذج فني غير معتمد؛ يلزم إعادة التحليل بعد تغير الشمعة أو إعلان مؤثر.\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch2>وش يدعم الفكرة؟\u003c/h2>${d.reasons.length?list(d.reasons):'\u003cp>حاليًا ما عندنا إشارات فنية إيجابية كافية.\u003c/p>'}\u003c/div>\u003cdiv class=\"card\">\u003ch2>وش المخاطر ووش الناقص؟\u003c/h2>${list(d.risks)}\u003c/div>\u003cdiv class=\"card\">\u003ch2>السيولة\u003c/h2>\u003cp>قيمة التداول المقدرة: ${billion(d.liquidity.estimated_turnover_sar)}\u003c/p>\u003cp>مقارنتها بمتوسط20 جلسة: ${N(d.liquidity.relative_turnover)}x\u003c/p>\u003csmall>${E(d.liquidity.method)}\u003c/small>\u003c/div>\u003cdiv class=\"card wide\">\u003ch2>الشركة والقوائم المالية\u003c/h2>\u003cp>نوع الفترة: ${E(f.period==='annual'?'سنوية':f.period==='quarterly'?'ربعية':f.period)} · قائمة الدخل ${E(f.income_date)} · الميزانية ${E(f.balance_date)} · التدفقات ${E(f.cashflow_date)}\u003c/p>\u003ctable>${[['الإيرادات',billion(f.revenue)],['صافي الربح',billion(f.net_income)],['هامش صافي الربح',pct(f.net_margin_pct)],['نمو الإيرادات مقابل فترة سنوية سابقة',pct(f.revenue_growth_pct)],['الديون',billion(f.total_debt)],['حقوق الملكية',billion(f.equity)],['التدفق التشغيلي',billion(f.operating_cash_flow)],['التدفق الحر كما أرسله المزود',billion(f.free_cash_flow)],['مكرر الربحية',N(v.pe_ratio)],['مضاعف القيمة الدفترية',N(v.price_to_book)]].map(([k,x])=>`\u003ctr>\u003ctd>${E(k)}\u003c/td>\u003ctd>${E(x)}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003cp>المكرر لا يثبت رخص السهم وحده؛ لم تتوفر مقارنة قطاعية موثقة. لا تُخلط هذه الفترات السنوية مع نتائج ربع واحد. تاريخ المقارنة: ${E(f.growth_comparison_date)}.\u003c/p>\u003c/div>\u003cdiv class=\"card wide\">\u003ch2>التوزيعات\u003c/h2>\u003cp>عائد آخر12 شهرًا من المزود: ${N(div.trailing_12m_yield)}% · المجموع للسهم: ${N(div.trailing_12m_dividends)} ريال\u003c/p>\u003ctable>\u003ctr>\u003cth>الإعلان\u003c/th>\u003cth>الاستحقاق\u003c/th>\u003cth>الدفع\u003c/th>\u003cth>ريال/سهم\u003c/th>\u003c/tr>${(div.history||[]).slice(0,4).map(x=>`\u003ctr>\u003ctd>${E(x.announcement_date)}\u003c/td>\u003ctd>${E(x.eligibility_date)}\u003c/td>\u003ctd>${E(x.distribution_date)}\u003c/td>\u003ctd>${N(x.value)}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003c/div>\u003cdiv class=\"card wide\">\u003ch2>الأخبار والإعلانات\u003c/h2>${news}\u003csmall>${E(d.event_semantics)}\u003c/small>\u003cp>${site}\u003c/p>\u003c/div>\u003cdiv class=\"card wide\">\u003cdetails>\u003csummary>من وين جبنا المعلومات؟\u003c/summary>\u003ctable>${Object.entries(d.sources).map(([k,x])=>`\u003ctr>\u003ctd>${E(k)}\u003c/td>\u003ctd>${E(x.status)}\u003c/td>\u003ctd>${E(x.endpoint)}\u003c/td>\u003ctd>${E(x.retrieved_at)}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003c/details>\u003c/div>\u003c/div>`;\n}\ndocument.querySelector('#form').onsubmit=async e=>{e.preventDefault();let b=document.querySelector('#go'),err=document.querySelector('#error');b.disabled=true;err.textContent='لحظة، نجيب البيانات ونحلّل السهم…';document.querySelector('#out').innerHTML='';try{let r=await securedFetch('/api/research/'+encodeURIComponent(document.querySelector('#symbol').value.trim()));let d=await r.json();if(!r.ok)throw Error(d.detail||'تعذر التحليل');render(d);err.textContent='جهز تحليل السهم.'}catch(x){err.textContent=x.message}finally{b.disabled=false}};\n\nconst fields=[['مكرر الربحية',r=>r.fundamentals.pe_ratio],['مضاعف الدفترية',r=>r.fundamentals.price_to_book],['هامش الربح السنوي %',r=>r.financials.net_margin_pct],['دين/حقوق ملكية %',r=>r.financials.debt_equity_pct],['عائد التوزيعات %',r=>r.dividends.trailing_12m_yield],['العائد على حقوق الملكية السنوي %',r=>r.provider_ratios?.ratios?.[0]?.ratios?.roe],['نمو الإيرادات السنوي من المزود %',r=>r.provider_ratios?.ratios?.[0]?.ratios?.revenue_growth_yoy]];\ndocument.querySelector('#compare').onclick=async()=>{let box=document.querySelector('#comparison');box.textContent='لحظة، نقارن الشركتين…';try{let a=document.querySelector('#symbol').value.trim(),b=document.querySelector('#peer').value.trim();let res=await securedFetch('/api/compare/'+encodeURIComponent(a)+'/'+encodeURIComponent(b));let d=await res.json();if(!res.ok)throw Error(d.detail);let [x,y]=d.reports;box.innerHTML=`\u003cp>${E(d.sector)} — ${E(d.meaning)}\u003c/p>\u003ctable>\u003ctr>\u003cth>المقياس\u003c/th>\u003cth>${E(x.name)}\u003c/th>\u003cth>${E(y.name)}\u003c/th>\u003c/tr>${fields.map(([name,get])=>`\u003ctr>\u003ctd>${E(name)}\u003c/td>\u003ctd>${N(get(x))}\u003c/td>\u003ctd>${N(get(y))}\u003c/td>\u003c/tr>`).join('')}\u003c/table>\u003cp>تواريخ القوائم: ${E(x.financials.income_date)} / ${E(y.financials.income_date)}. لا تُستنتج الأفضلية من المكرر وحده، ومخاطر الأخبار غير مكتملة. بيانات النسب من المزود: ${E(x.sources.ratios.status)} / ${E(y.sources.ratios.status)}. غياب النسبة لا يعني صفرًا؛ التدفقات والديون في البنوك تحتاج تفسيرًا مختلفًا عن الشركات الصناعية.\u003c/p>`;usage()}catch(e){box.textContent=e.message}};\nfunction notes(){let symbol=document.querySelector('#symbol').value.trim();let xs;try{xs=JSON.parse(localStorage.getItem('SAHM_NEWS_REVIEW_'+symbol)||'[]')}catch{xs=[]}document.querySelector('#newsNotes').innerHTML=list(xs.map(x=>x.date+' — '+x.title+' — '+x.url));}\ndocument.querySelector('#symbol').addEventListener('change',notes);\ndocument.querySelector('#saveNews').onclick=()=>{let symbol=document.querySelector('#symbol').value.trim(),title=document.querySelector('#newsTitle').value.trim(),date=document.querySelector('#newsDate').value,url=document.querySelector('#newsUrl').value.trim();try{if(!/^[0-9]{4,6}$/.test(symbol)||!title||!date||new URL(url).protocol!=='https:')throw Error('أدخل رمز السهم والعنوان والتاريخ ورابط HTTPS الأصلي.');let xs=JSON.parse(localStorage.getItem('SAHM_NEWS_REVIEW_'+symbol)||'[]');xs.push({title,date,url,recorded_at:new Date().toISOString(),type:'user_review_unverified'});localStorage.setItem('SAHM_NEWS_REVIEW_'+symbol,JSON.stringify(xs));notes()}catch(e){document.querySelector('#newsNotes').textContent=e.message}};\nasync function usage(){try{let d=await(await securedFetch('/api/plan-status')).json();document.querySelector('#planUsage').textContent='استخدام هذه الخدمة اليوم: '+d.used_by_this_runtime_today+' طلبًا / '+d.local_daily_limit+' ميزانية محلية. العد UTC؛ لا يشمل البرامج الأخرى أو سجل البحث اليومي.'}catch{}}\nusage();\n\u003c/script>\u003c/html>\n";
const URL_BASE='https://uwwuchwivroukskddkhq.supabase.co',KEY='sb_publishable_nq98s8SPKegEmVrYcD9ewA_jEuYA7yh';let session=null;const frame=document.querySelector('#report');
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow||e.data?.type!=='SAHM_AUTH_REQUEST'||!session)return;frame.contentWindow.postMessage({type:'SAHM_AUTH',token:session.access_token},location.origin)});

document.querySelector('#signin').onsubmit=async e=>{e.preventDefault();const btn=document.querySelector('#submit'),err=document.querySelector('#error');btn.disabled=true;err.textContent='';try{const r=await fetch(URL_BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:document.querySelector('#email').value.trim(),password:document.querySelector('#password').value})});document.querySelector('#password').value='';if(!r.ok)throw Error('راجع البريد وكلمة المرور وحاول مرة ثانية.');session=await r.json();const access=await fetch(URL_BASE+'/functions/v1/sahm-engine/api/plan-status',{headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}});if(!access.ok){session=null;throw Error('دخول الأسواق مو مفعّل لحسابك، أو الخدمة غير متاحة. راجع مدير المنظومة.')}show()}catch(e){err.textContent=e.message}finally{btn.disabled=false}};
document.querySelector('#logout').onclick=async()=>{if(session)try{await fetch(URL_BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token}})}catch{}session=null;frame.srcdoc='';document.querySelector('#market').hidden=true;document.querySelector('#login').hidden=false};
</script></html>
