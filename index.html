<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومة الشؤون الإدارية</title>
<meta name="description" content="منظومة الشؤون الإدارية — إدارة الأفراد والمعاملات">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E3A38">
<style>
  html,body{height:100%;margin:0;padding:0;overflow:hidden;background:#0E3A38;
    font-family:'Tajawal','Segoe UI',Tahoma,Arial,sans-serif}

  /* حاوية ملء الشاشة — أي إطار بداخلها يمتد كامل الصفحة */
  #frame{position:fixed;inset:0;z-index:2}
  #frame iframe,#frame > *{width:100%!important;height:100%!important;border:0!important;display:block}

  /* شاشة الانتظار خلف الإطار */
  #boot{position:fixed;inset:0;z-index:1;display:grid;place-items:center;
    background:radial-gradient(1000px 600px at 70% -10%,#14514D 0%,#0E3A38 45%,#071F1E 100%);color:#DCE8E4}
  #boot .c{text-align:center}
  #boot .crest{width:58px;height:58px;margin:0 auto 14px;border-radius:15px;display:grid;place-items:center;
    background:linear-gradient(150deg,#D8B573,#B08640);color:#0A2B29;box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
  #boot h1{margin:0;font-size:19px;font-weight:800;color:#fff}
  #boot p{margin:4px 0 18px;font-size:13px;color:#8FADA6;font-weight:600}
  #boot .bar{width:170px;height:4px;border-radius:20px;background:rgba(255,255,255,.12);overflow:hidden;margin:0 auto}
  #boot .bar i{display:block;height:100%;width:35%;background:#D8B573;border-radius:20px;animation:slide 1.1s ease-in-out infinite}
  @keyframes slide{0%{transform:translateX(190%)}100%{transform:translateX(-190%)}}
  #boot .credit{margin-top:22px;font-size:11px;color:#6D8A84;font-weight:600}
  @media (prefers-reduced-motion:reduce){#boot .bar i{animation:none;width:100%}}
</style>
</head>
<body>

<div id="boot">
  <div class="c">
    <div class="crest">
      <svg width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5.5v6c0 5 3.4 9.2 8 10.5 4.6-1.3 8-5.5 8-10.5v-6L12 2Z"/><path d="m9 12 2 2 4-4"/></svg>
    </div>
    <h1>منظومة الشؤون الإدارية</h1>
    <p>إدارة الأفراد والمعاملات</p>
    <div class="bar"><i></i></div>
    <div class="credit">إنشاء وعمل: أحمد السعيدي — خاص</div>
  </div>
</div>

<div id="frame">

  <!-- ═══════════════════════════════════════════════════════════
       ضع كود التضمين هنا بالضبط، بين هذا السطر والسطر الذي تحته.

       من أين تجلبه:
       افتح المنظومة في Claude ← اضغط «Publish artifact» ←
       بعد النشر يظهر زر «Get embed code» ← اكتب نطاقك في خانة
       Allowed domains ← انسخ الكود والصقه هنا مكان هذا التعليق.
       ═══════════════════════════════════════════════════════════ -->
<iframe
  src="https://claude.site/public/artifacts/0ca262d3-f5a7-40fd-8834-ca18cdf05094/embed"
  title="Crm"
  width="100%"
  height="100%"
  frameborder="0"
  allow="clipboard-write"
  allowfullscreen>
</iframe>

  <!-- ═══ نهاية مكان الكود ═══ -->

</div>

<script>
  // إخفاء شاشة الانتظار بعد تحميل الإطار
  function hideBoot(){ var b=document.getElementById('boot'); if(b) b.style.display='none'; }
  window.addEventListener('load', function(){ setTimeout(hideBoot, 600); });
  setTimeout(hideBoot, 6000); // احتياط في حال تأخر التحميل
</script>

</body>
</html>
