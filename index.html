<style>
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/plex-arabic-400.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/plex-arabic-600.woff2') format('woff2');unicode-range:U+0600-06FF,U+0750-077F,U+0870-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/plex-latin-400.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/plex-latin-600.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --ui-font:'IBM Plex Sans Arabic',Arial,Tahoma,sans-serif;
  --bg:#EDF0EE; --surface:#FFFFFF; --surface-2:#F6F8F6; --paper:#FBF8F1;
  --ink:#0F2320; --ink-2:#4A5C58; --ink-3:#7E8F8B;
  --line:#DCE3E0; --line-2:#EAEFEC;
  --pine:#0E3A38; --pine-2:#14514D; --pine-3:#0A2B29;
  --brass:#B08640; --brass-2:#D8B573;
  --green:#17795E; --green-bg:#E2F2EC; --green-br:#C2E2D6;
  --red:#A3231C;   --red-bg:#FBE9E7;   --red-br:#F3CFCB;
  --blue:#1B5E9E;  --blue-bg:#E6EFF8;  --blue-br:#C7DCF0;
  --amber:#A96A12; --amber-bg:#FBF0DE; --amber-br:#EEDCB8;
  --plum:#6A3E86;  --plum-bg:#F1E9F7;  --plum-br:#DECDEB;
  --gold:#8A6520;  --gold-bg:#F7EFDE;  --gold-br:#EAD8B2;
  --slate:#4A5C58; --slate-bg:#F0F3F1; --slate-br:#DCE3E0;
  --shadow-sm:0 1px 2px rgba(14,58,56,.08);
  --shadow:0 2px 4px rgba(14,58,56,.06), 0 14px 34px rgba(14,58,56,.10);
}
html[data-theme="dark"]{
  --bg:#08110F; --surface:#0E1C1A; --surface-2:#132522; --paper:#151F1C;
  --ink:#E7EFEC; --ink-2:#A6BAB5; --ink-3:#7A908B;
  --line:#1F3733; --line-2:#182C29;
  --green:#4FC79E; --green-bg:#0F332A; --green-br:#1C5544;
  --red:#F08A82;   --red-bg:#3A1614;   --red-br:#5C2621;
  --blue:#6FB0E8;  --blue-bg:#12283C;  --blue-br:#20415F;
  --amber:#E0A94E; --amber-bg:#33260F; --amber-br:#553F19;
  --plum:#B98FD6;  --plum-bg:#261730;  --plum-br:#3E2851;
  --gold:#D8B573;  --gold-bg:#2E2412;  --gold-br:#4B3B1C;
  --slate:#A6BAB5; --slate-bg:#152522; --slate-br:#26403B;
  --shadow:0 2px 4px rgba(0,0,0,.3), 0 14px 34px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui-font);
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:20px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
[hidden]{display:none!important}

/* ============ بوابة الدخول ============ */
.gate{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 700px at 70% -10%,#14514D 0%,#0E3A38 45%,#071F1E 100%);overflow-y:auto}
.gcard{width:100%;max-width:430px;background:var(--surface);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
.ghead{padding:26px 26px 20px;text-align:center;border-bottom:1px solid var(--line)}
.ghead .crest{width:56px;height:56px;margin:0 auto 12px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brass-2),var(--brass));color:var(--pine-3);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.ghead h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px}
.ghead p{margin:3px 0 0;font-size:13px;color:var(--ink-3);font-weight:600}
.gbody{padding:22px 26px}
.gfoot{padding:14px 26px;background:var(--surface-2);border-top:1px solid var(--line);text-align:center;
  font-size:11.5px;color:var(--ink-3);font-weight:600;line-height:1.9}
.gnote{background:var(--gold-bg);border:1px solid var(--gold-br);color:var(--gold);border-radius:9px;
  padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.75;margin-bottom:14px}
.gerr{background:var(--red-bg);border:1px solid var(--red-br);color:var(--red);border-radius:9px;
  padding:10px 12px;font-size:13px;font-weight:700;margin-bottom:13px}
.gbig{width:100%;justify-content:center;padding:12px;font-size:15px}
.pwbar{height:5px;border-radius:20px;background:var(--line-2);overflow:hidden;margin-top:6px}
.pwbar i{display:block;height:100%;width:0;transition:width .2s,background .2s}

/* ============ الهيكل ============ */
.app{display:flex;min-height:100vh}
.side{width:264px;flex:0 0 264px;background:linear-gradient(180deg,var(--pine),var(--pine-3));
  color:#DCE8E4;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;z-index:40}
.brand{padding:17px 17px 14px;border-bottom:1px solid rgba(216,181,115,.18)}
.brand-row{display:flex;align-items:center;gap:11px}
.crest{width:40px;height:40px;flex:none;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--brass-2),var(--brass));color:var(--pine-3);box-shadow:inset 0 -2px 0 rgba(0,0,0,.14)}
.brand h1{margin:0;font-size:15.5px;font-weight:800;color:#fff;letter-spacing:-.2px}
.brand p{margin:1px 0 0;font-size:11px;color:#8FADA6;font-weight:600}
.unit-name{margin-top:12px;width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);
  color:#EAF2EF;border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:500;text-align:right}
.unit-name::placeholder{color:#7C9992}
.unit-name:disabled{opacity:.6}
.who{display:flex;align-items:center;gap:9px;padding:11px 17px;background:rgba(0,0,0,.16);border-bottom:1px solid rgba(255,255,255,.06)}
.who .av{width:31px;height:31px;border-radius:8px;background:rgba(216,181,115,.2);color:var(--brass-2);
  display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.who b{display:block;font-size:12.5px;font-weight:700;color:#fff;line-height:1.3}
.who span{font-size:10.5px;color:#8FADA6;font-weight:600}
.who .out{margin-inline-start:auto;color:#8FADA6;width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.who .out:hover{background:rgba(255,255,255,.1);color:#fff}
.nav{padding:12px;display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.nav-label{font-size:11px;color:#719089;padding:5px 8px 4px;font-weight:700;display:flex;align-items:center;gap:6px}
.nav-label::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.09)}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:9px;color:#C3D6D1;
  font-size:14.5px;font-weight:500;text-align:right;width:100%;position:relative;transition:background .14s,color .14s}
.nav-item svg{flex:none;opacity:.85}
.nav-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.on{background:rgba(255,255,255,.09);color:#fff;font-weight:700}
.nav-item.on svg{opacity:1;color:var(--acc)}
.nav-item.on::before{content:"";position:absolute;right:-12px;top:8px;bottom:8px;width:3px;background:var(--acc);border-radius:0 3px 3px 0}
.nav-item .count{margin-inline-start:auto;font-size:11.5px;background:rgba(255,255,255,.1);padding:1px 8px;border-radius:20px;font-weight:700;color:#D8E6E2}
.nav-add{margin-top:7px;width:100%;padding:9px;border:1px dashed rgba(216,181,115,.45);border-radius:9px;
  color:var(--brass-2);font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px}
.nav-add:hover{background:rgba(216,181,115,.12)}
.nav-group{margin:5px 0;border:1px solid rgba(255,255,255,.08);border-radius:9px;overflow:hidden;background:rgba(0,0,0,.08)}
.nav-group-head{width:100%;display:flex;align-items:center;gap:7px;padding:8px 10px;color:#D8E6E2;font-size:12.5px;font-weight:700}
.nav-group-head .count{margin-inline-start:auto;background:rgba(255,255,255,.1);padding:0 7px;border-radius:20px}.nav-group-head .arr{transition:transform .15s}.nav-group.closed .arr{transform:rotate(90deg)}
.nav-group.closed .nav-group-pages{display:none}.nav-group-pages .nav-item{border-radius:0;padding-inline-start:15px}
.side-foot{padding:11px;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:7px}
.savepill{display:flex;align-items:center;gap:7px;font-size:11.5px;color:#93B0A9;padding:1px 4px}
.savepill .sz{margin-inline-start:auto;color:#7C9992}
.dot{width:7px;height:7px;border-radius:50%;background:#4FC79E;flex:none;box-shadow:0 0 0 3px rgba(79,199,158,.16)}
.dot.warn{background:var(--brass-2);box-shadow:0 0 0 3px rgba(216,181,115,.18)}
.dot.busy{background:#8FADA6}
.side-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side-tools-toggle{display:block;width:100%;padding:8px;border-radius:8px;background:rgba(255,255,255,.08);color:#D4E3DF;font-size:12px;font-weight:700}
.side-refresh{display:flex;width:100%;align-items:center;justify-content:center;gap:7px;padding:10px;border-radius:9px;background:linear-gradient(135deg,var(--brass-2),var(--brass));color:#153d39;font-size:12.5px;font-weight:900;box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}.side-refresh:disabled{opacity:.65}.side-refresh.loading svg{animation:spin .8s linear infinite}
.side-foot #sideBtns{display:none}.side-foot.tools-open #sideBtns{display:grid}
.sbtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);color:#D4E3DF;border-radius:8px;
  padding:8px 5px;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:5px}
.sbtn:hover{background:rgba(255,255,255,.14);color:#fff}
.sbtn.wide{grid-column:1/-1}
.credit{text-align:center;font-size:10.5px;color:#6D8A84;font-weight:600;padding-top:3px;line-height:1.7}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:13px 24px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.topbar h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
.topbar h2 .tag{width:9px;height:9px;border-radius:3px;background:var(--acc)}
.topbar .sub{margin:1px 0 0;font-size:12.5px;color:var(--ink-3);font-weight:500}
.burger{display:none;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;width:40px;height:40px;place-items:center}
.mobile-nav{display:none}
.pgtools{display:flex;gap:6px;flex-wrap:wrap}
.stripe{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;
  margin-inline-start:auto;box-shadow:var(--shadow-sm)}
.stripe .cell{padding:6px 16px;border-inline-start:1px solid var(--line-2);min-width:88px}
.stripe .cell:first-child{border:none}
.stripe .n{font-size:19px;font-weight:800;line-height:1.15;display:block}
.stripe .t{font-size:11.5px;color:var(--ink-3);font-weight:600}
.page{padding:19px 24px 60px;flex:1}
.welcome{max-width:1120px;margin:0 auto;padding:18px 0 28px}.welcome-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 15% 15%,rgba(216,181,115,.19),transparent 30%),linear-gradient(135deg,#0d4945,#062d2b 72%);color:#fff;border:1px solid rgba(216,181,115,.15);border-radius:22px;padding:28px 32px;box-shadow:0 14px 36px rgba(5,45,42,.18);display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;min-height:176px}
.welcome-hero:after{content:"";position:absolute;width:260px;height:260px;border:1px solid rgba(255,255,255,.08);border-radius:50%;left:-80px;bottom:-150px;box-shadow:0 0 0 32px rgba(255,255,255,.025),0 0 0 70px rgba(255,255,255,.018)}
.welcome-copy{position:relative;z-index:1}.welcome-kicker{display:inline-flex;align-items:center;gap:7px;color:#e7c983;font-size:11.5px;font-weight:800;margin-bottom:9px}.welcome-kicker:before{content:"";width:22px;height:2px;background:#d8b573;border-radius:3px}.welcome-hero h2{font-size:27px;margin:0 0 6px;letter-spacing:-.4px}.welcome-hero p{margin:0;color:#c0d2ce;font-size:13px}.welcome-date{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}.welcome-date span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);padding:6px 10px;border-radius:8px;font-size:11.5px;color:#d9e6e2}
.welcome-logo{width:88px;height:88px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(150deg,#e7c779,#ba8a36);color:var(--pine-3);box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),0 12px 28px rgba(0,0,0,.18);position:relative;z-index:1}.welcome-logo:after{content:"";position:absolute;inset:-8px;border:1px solid rgba(239,209,140,.22);border-radius:30px}
.welcome-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}.welcome-stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 16px;box-shadow:0 5px 15px rgba(5,45,42,.055)}.welcome-stat b{display:block;font-size:22px;color:var(--pine)}.welcome-stat span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.welcome-section-title{display:flex;align-items:end;justify-content:space-between;margin:24px 3px 10px}.welcome-section-title h3{margin:0;font-size:17px}.welcome-section-title span{font-size:11.5px;color:var(--ink-3)}.welcome-pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:start}
.welcome-card,.home-group-head{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:14px 12px;text-align:center;box-shadow:0 5px 15px rgba(5,45,42,.055);display:flex;flex-direction:column;align-items:center;gap:7px;transition:.18s;position:relative;min-height:116px}.welcome-card:hover,.home-group-head:hover{transform:translateY(-2px);border-color:var(--brass);box-shadow:var(--shadow-sm)}
.welcome-card .wi,.home-group-head .wi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:var(--surface-2);color:var(--pine);flex:none}.welcome-card b,.home-group-head b{display:block;font-size:13px;line-height:1.45}.welcome-card span span,.home-group-head small{font-size:10.5px;color:var(--ink-3)}.home-group{position:relative}.home-group-head{width:100%}.home-group-head .grp-arr{position:absolute;left:10px;top:10px;color:var(--ink-3);transition:.18s}.home-group.open .grp-arr{transform:rotate(180deg)}.home-group-menu{display:none;margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}.home-group.open .home-group-menu{display:block}.home-group-menu button{display:flex;width:100%;align-items:center;gap:8px;padding:9px;border-radius:8px;text-align:right;font-size:11.5px;font-weight:700}.home-group-menu button:hover{background:var(--surface-2)}
.home-banners{margin-top:16px;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 8px 24px rgba(5,45,42,.12);width:100%;background:#0b403c}.home-banner{display:none;width:100%;aspect-ratio:16/5;min-height:260px;padding:30px 34px;color:#fff;background:linear-gradient(110deg,#073d39,#17615b);background-size:cover;background-position:center;align-items:flex-end;position:relative;text-align:right}.home-banner.on{display:flex}.home-banner:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,32,30,.08),rgba(3,32,30,.76))}.home-banner-content{position:relative;z-index:1;max-width:70%}.home-banner b{font-size:24px;display:block}.home-banner span{font-size:12.5px;color:#d5e5e1}.home-banner-open{display:inline-flex!important;margin-top:10px;padding:7px 13px;border-radius:9px;background:#d8b573!important;color:#173d38!important;font-weight:800!important}.banner-dots{position:absolute;z-index:3;bottom:14px;left:18px;display:flex;gap:5px}.banner-dots button{width:8px;height:8px;border-radius:9px;background:rgba(255,255,255,.45)}.banner-dots button.on{width:22px;background:#efd18c}
.date-converter{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:0 16px;box-shadow:0 5px 15px rgba(5,45,42,.05)}.date-converter summary{list-style:none;cursor:pointer}.date-converter summary::-webkit-details-marker{display:none}.date-converter-head{display:flex;align-items:center;gap:9px;padding:13px 0}.date-converter-head:after{content:'⌄';margin-inline-start:auto;color:var(--ink-3);transition:.18s}.date-converter[open] .date-converter-head:after{transform:rotate(180deg)}.date-converter-head i{width:34px;height:34px;border-radius:10px;background:#e9f2f0;color:var(--pine);display:grid;place-items:center}.date-converter-head b{font-size:13.5px}.date-converter-head span{font-size:10.5px;color:var(--ink-3);display:block}.date-converter-body{padding:0 0 15px;border-top:1px solid var(--line-2)}.date-converter-grid{display:grid;grid-template-columns:1fr auto 1.35fr;gap:10px;align-items:end;padding-top:13px}.date-swap{width:38px;height:38px;border-radius:50%;background:var(--gold-bg);color:var(--gold);font-size:18px;margin-bottom:2px}.date-result{margin-top:9px;padding:9px 12px;border-radius:9px;background:rgba(17,82,77,.07);color:var(--pine);font-size:12px;font-weight:800;display:none}.hijri-selects{display:grid;grid-template-columns:1fr 1.25fr .85fr;gap:7px}.hijri-selects select{width:100%;min-width:0;padding:11px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);font-size:13px}
.welcome-popup-img{width:100%;max-height:55vh;object-fit:contain;border-radius:11px;background:var(--surface-2);display:block}.welcome-popup-text{text-align:center;line-height:1.9;margin:13px 4px 0;color:var(--ink-2)}

.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.file-tools{display:flex;gap:8px;align-items:center}
.file-tools-toggle,.mobile-brand-title{display:none}
.search{position:relative;flex:1;min-width:190px;max-width:360px}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{width:100%;padding:10px 38px 10px 14px;border:1px solid var(--line);background:var(--surface);border-radius:9px;font-size:14px}

================================================================== */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayISO=()=>new Date().toISOString().slice(0,10);
const localISO=d=>{const x=d||new Date();return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`};
const nowTs=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uniq=a=>[...new Set(a.filter(x=>x!==''&&x!=null))];
function toast(m,t){const e=document.createElement('div');e.className='toast '+(t||'');e.textContent=m;$('#toasts').appendChild(e);setTimeout(()=>e.remove(),3200);}
function fmtSize(b){ return b>=1048576?(b/1048576).toFixed(1)+' م.ب':Math.max(1,Math.round(b/1024))+' ك.ب'; }
function vaultSize(v){return new Blob([JSON.stringify(v||{})]).size}

const LIBLOAD={};
function loadScriptOnce(src,test){if(test())return Promise.resolve(true);if(LIBLOAD[src])return LIBLOAD[src];LIBLOAD[src]=new Promise(resolve=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=()=>resolve(!!test());s.onerror=()=>resolve(false);document.head.appendChild(s)});return LIBLOAD[src]}
const ensureXLSX=()=>loadScriptOnce('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',()=>!!window.XLSX);
const ensureTus=()=>loadScriptOnce('https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js',()=>!!window.tus);

async function ensurePdf(){if(window.pdfjsLib)return true;try{const m=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');m.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';window.pdfjsLib=m;return true}catch(e){return false}}

/* ---- التاريخ الهجري ---- */
let HJ,HJL;
try{ HJ=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'2-digit',day:'2-digit'});
     HJL=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{year:'numeric',month:'long',day:'numeric'}); }
catch(e){ HJ=null; }
const GG=new Intl.DateTimeFormat('en-GB',{year:'numeric',month:'2-digit',day:'2-digit'});
function toDate(d){ if(!d) return null; const x=new Date(d); return isNaN(x)?null:x; }
function fmtDate(d){ const x=toDate(d); if(!x) return '—';
  if(!HJ) return GG.format(x);
  return HJ.format(x).replace(/هـ/g,'').trim()+' هـ'; }
function fmtDateLong(d){ const x=toDate(d)||new Date();
  if(!HJL) return GG.format(x);
  return HJL.format(x).replace(/هـ/g,'').trim()+' هـ'; }
function fmtG(d){ const x=toDate(d); return x?GG.format(x):''; }
function hijriNums(d){try{const ps=new Intl.DateTimeFormat('en-u-ca-islamic-umalqura',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d),v=t=>+ps.find(x=>x.type===t).value;return {y:v('year'),m:v('month'),d:v('day')}}catch(e){return null}}
function hijriToGregorian(text){const s=String(text||'').trim(),m=s.match(/^(\d{1,4})[-\/]([0-1]?\d)[-\/](\d{1,4})$/);if(!m)return null;const yearFirst=m[1].length===4,target=yearFirst?{y:+m[1],m:+m[2],d:+m[3]}:{y:+m[3],m:+m[2],d:+m[1]};if(target.d<1||target.d>30||target.m<1||target.m>12||target.y<1318||target.y>1500)return null;const key=h=>h.y*10000+h.m*100+h.d,want=key(target),day=86400000;let lo=Math.floor(new Date(1900,3,30,12).getTime()/day),hi=Math.ceil(new Date(2077,10,16,12).getTime()/day);while(lo<=hi){const mid=Math.floor((lo+hi)/2),x=new Date(mid*day),h=hijriNums(x);if(!h)return null;const got=key(h);if(got===want)return new Date(x.getFullYear(),x.getMonth(),x.getDate(),12);if(got<want)lo=mid+1;else hi=mid-1}return null}

/* ---- تشفير ---- */
const TE=new TextEncoder(), TD=new TextDecoder(), ITERS=250000;
const SUB=(window.crypto&&window.crypto.subtle)?window.crypto.subtle:null;
function ab2b64(buf){ const b=new Uint8Array(buf); let s='',CH=0x8000;
  for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null,b.subarray(i,i+CH)); return btoa(s); }
function b642ab(s){ const bin=atob(s), b=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b.buffer; }
const rnd=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return a;};
async function gzipData(raw){
  if(raw.length<32768)return null;
  try{if('CompressionStream' in window){const stream=new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}if(await ensurePako())return window.pako.gzip(raw)}catch(e){}
  return null;
}
async function gunzipData(payload){
  if('DecompressionStream' in window){const stream=new Blob([payload]).stream().pipeThrough(new DecompressionStream('gzip'));return new Uint8Array(await new Response(stream).arrayBuffer())}
  if(await ensurePako())return window.pako.ungzip(payload);
  throw new Error('تعذر فتح البيانات المضغوطة');
}
async function deriveKEK(pw,saltB64,iters){
  const base=await SUB.importKey('raw',TE.encode(pw),'PBKDF2',false,['deriveKey']);
  return SUB.deriveKey({name:'PBKDF2',salt:new Uint8Array(b642ab(saltB64)),iterations:iters||ITERS,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encObj(key,obj){ const iv=rnd(12);
  const raw=TE.encode(JSON.stringify(obj)); let payload=raw,zip='';
  const packed=await gzipData(raw);if(packed&&packed.length<raw.length*.92){payload=packed;zip='gzip'}
  const ct=await SUB.encrypt({name:'AES-GCM',iv},key,payload);
  return {iv:ab2b64(iv),ct:ab2b64(ct),...(zip?{zip,rawSize:raw.length}:{})}; }
async function decObj(key,rec){ const pt=await SUB.decrypt({name:'AES-GCM',iv:new Uint8Array(b642ab(rec.iv))},key,b642ab(rec.ct));
  let payload=new Uint8Array(pt);
  if(rec.zip==='gzip')payload=await gunzipData(payload);
  return JSON.parse(TD.decode(payload)); }
async function newDEK(){ return SUB.generateKey({name:'AES-GCM',length:256},true,['encrypt','decrypt']); }
async function wrapDEK(kek,dek){ const raw=await SUB.exportKey('raw',dek), iv=rnd(12);
  return {wrapIv:ab2b64(iv),wrapped:ab2b64(await SUB.encrypt({name:'AES-GCM',iv},kek,raw))}; }
async function unwrapDEK(kek,u){ const raw=await SUB.decrypt({name:'AES-GCM',iv:new Uint8Array(b642ab(u.wrapIv))},kek,b642ab(u.wrapped));
  return SUB.importKey('raw',raw,{name:'AES-GCM'},true,['encrypt','decrypt']); }
function pwScore(p){ let s=0; if(p.length>=8)s++; if(p.length>=12)s++; if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;
  if(/[0-9]/.test(p))s++; if(/[^A-Za-z0-9]/.test(p))s++; return Math.min(s,5); }

   1) الخزنة والحالة
================================================================== */
const VKEY='admin_suite_vault_v3', OLD2='crm_pages_v2', OLD1='crm_registry_v1';

const SB_KEY='sb_publishable_nq98s8SPKegEmVrYcD9ewA_jEuYA7yh';

function gate(html){ $('#gateBody').innerHTML=html; $('#gate').hidden=false; $('#app').hidden=true; }
function gErr(m){ const e=document.createElement('div'); e.className='gerr'; e.textContent=m;
  const b=$('#gateBody'); const old=b.querySelector('.gerr'); if(old) old.remove(); b.prepend(e); }
function secNote(){ $('#gateSec').textContent = SUB?'البيانات مشفّرة AES‑256‑GCM · اشتقاق المفتاح PBKDF2 ('+ITERS.toLocaleString('en')+' دورة)':'⚠ التشفير غير متاح في هذا المتصفح'; }
function confirmUrl(token){ return location.origin+location.pathname+(token?'?invite='+encodeURIComponent(token):''); }
function authMessage(m){ const s=String(m||'');
  if(/Email not confirmed/i.test(s)) return 'البريد الإلكتروني لم يُؤكَّد بعد.';
  if(/Invalid login credentials/i.test(s)) return 'البريد الإلكتروني أو كلمة المرور غير صحيحة.';
  if(/User already registered/i.test(s)) return 'يوجد حساب مسجل بهذا البريد مسبقًا.';
  if(/Invitation email mismatch/i.test(s)) return 'هذه الدعوة مرتبطة ببريد موظف مختلف. يمكنك الدخول بحساب المدير بصورة طبيعية.';
  if(/rate limit/i.test(s)) return 'تم إرسال رسائل كثيرة. انتظر قليلًا ثم أعد المحاولة.';
  return s||'تعذّر إكمال العملية.';
}

async function boot(){
  secNote();
  if(!INVITE_TOKEN) localStorage.removeItem(PENDING_INVITE);
  if(!SUB){ gate(`<div class="gerr">هذا المتصفح لا يوفّر واجهة التشفير (Web Crypto). افتح النظام عبر رابط https أو استخدم متصفحاً حديثاً.</div>`); return; }
  if(!SB){ gate(`<div class="gerr">تعذّر تحميل خدمة المزامنة. تحقق من اتصال الإنترنت ثم أعد تحميل الصفحة.</div>`); return; }
  try{
    const session=await cloudSession();
    if(!session) return INVITE_TOKEN?screenInvite():screenLogin();
    const pi=localGet(PENDING_INVITE), token=INVITE_TOKEN||(pi&&pi.token)||'', sessionMail=String(session.user.email||'').toLowerCase();
    if(INVITE_TOKEN&&(!pi||pi.email!==sessionMail)){ await SB.auth.signOut(); SB_SESSION=null; WORKSPACE_ID=null; return screenInvite(); }
    if(token&&pi&&pi.email===sessionMail){ await claimInvite(token); localStorage.removeItem(PENDING_INVITE); INVITE_TOKEN=''; history.replaceState({},'',location.pathname); }
    VAULT=await vaultRead();
    if(!VAULT||!VAULT.users||!VAULT.users.length){
      const pending=localGet(PENDING_KEY);
      if(pending&&pending.email===String(session.user.email||'').toLowerCase()){
        VAULT=pending.vault; await createWorkspace(VAULT); localStorage.removeItem(PENDING_KEY);
      } else return screenLogin(null,'هذا الحساب غير مرتبط بالمنشأة. اطلب دعوة من مالك النظام.');
    }
    const resumed=await takeRefreshSession();
    if(resumed&&resumed.key){
      try{
        const member=VAULT.users.find(x=>x.id===resumed.userId&&x.email.toLowerCase()===sessionMail);
        if(member){ DEK=resumed.key;DB=await decObj(DEK,VAULT.data);MYREV=VAULT.rev||1;ME=(DB.users||[]).find(x=>x.id===resumed.userId);if(ME){history.replaceState({},'',location.pathname);enterApp();toast('تم تحديث المنظومة إلى أحدث نسخة');return;} }
      }catch(e){ DEK=null;DB=null;ME=null; }
    }
    screenLogin({email:session.user.email||''},'الجلسة السحابية متصلة. أدخل كلمة المرور لفك تشفير بياناتك.');
  }catch(e){ screenLogin(null,'تعذّر الاتصال بالسحابة مؤقتاً. تحقق من الإنترنت ثم حاول الدخول.'); }
}

async function doInviteSignup(){
  const name=$('#i_name').value.trim(), mail=$('#i_mail').value.trim().toLowerCase(), pw=$('#i_pw').value;
  const token=INVITE_TOKEN||(localGet(PENDING_INVITE)||{}).token||'';
  if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)||pw.length<8) return gErr('أكمل الاسم والبريد وكلمة المرور المؤقتة.');
  const btn=$('#i_go'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> جارٍ التفعيل…';
  try{
    localSet(PENDING_INVITE,{token,email:mail,name});
    const auth=await SB.auth.signUp({email:mail,password:pw,options:{emailRedirectTo:confirmUrl(token)}}); if(auth.error) throw auth.error;
    SB_SESSION=auth.data.session||null; WORKSPACE_ID=null;
    if(!SB_SESSION){ screenAwaitConfirm(mail,token); return; }
    await claimInvite(token); localStorage.removeItem(PENDING_INVITE); INVITE_TOKEN=''; history.replaceState({},'',location.pathname);
    screenLogin({email:mail},'تم تفعيل الدعوة. أدخل كلمة المرور المؤقتة لفتح الخزنة.');

}

async function doLogin(){
  const mail=$('#l_mail').value.trim().toLowerCase(), pw=$('#l_pw').value;
  const btn=$('#l_go'); btn.innerHTML='<span class="spin"></span> جارٍ فك التشفير…'; btn.disabled=true;
  let u=null;
  try{
    const auth=await SB.auth.signInWithPassword({email:mail,password:pw});
    if(auth.error) throw auth.error;
    SB_SESSION=auth.data.session; WORKSPACE_ID=null;
    const pi=localGet(PENDING_INVITE), token=INVITE_TOKEN||(pi&&pi.token)||'';
    if(token&&pi&&pi.email===mail){ await claimInvite(token); localStorage.removeItem(PENDING_INVITE); INVITE_TOKEN=''; history.replaceState({},'',location.pathname); }
    VAULT=await vaultRead();
    if(!VAULT){
      const pending=localGet(PENDING_KEY);
      if(pending&&pending.email===mail){ VAULT=pending.vault; await createWorkspace(VAULT); localStorage.removeItem(PENDING_KEY); }
      else throw new Error('هذا الحساب غير مدعو إلى المنشأة. راجع مالك النظام.');
    }
    u=VAULT.users.find(x=>x.email.toLowerCase()===mail);
    if(!u) throw new Error('هذا البريد غير مسجل داخل الخزنة.');
    if(u.active===false) throw new Error('هذا الحساب موقوف. راجع مدير النظام.');
    if(u.lockUntil&&Date.now()<u.lockUntil){
      const m=Math.ceil((u.lockUntil-Date.now())/60000); throw new Error(`الحساب مقفل مؤقتاً. أعد المحاولة بعد ${m} دقيقة.`); }
    const kek=await deriveKEK(pw,u.salt,VAULT.iters||ITERS);
    const dek=await unwrapDEK(kek,u);
    const data=await decObj(dek,VAULT.data);
    const firstActivation=!u.activatedAt; u.fails=0; u.lockUntil=0; u.activatedAt=u.activatedAt||nowTs();
    DEK=dek; DB=data; MYREV=VAULT.rev||1;
    ME=(DB.users||[]).find(x=>x.id===u.id);
    if(!ME){ ME={id:u.id,name:u.email,role:'admin',perms:{},canExport:true,canImport:true}; DB.users=DB.users||[]; DB.users.push(ME); }
    if(firstActivation&&ME.role!=='admin') ME.mustChangePassword=true;
    audit('دخول','تسجيل دخول ناجح');
    enterApp();
    save();
    if(ME.mustChangePassword) setTimeout(()=>openChangePw(true,pw),80);
  }catch(e){
    if(u){ u.fails=(u.fails||0)+1;
      if(u.fails>=5){ u.lockUntil=Date.now()+5*60000; u.fails=0; }
      try{ await vaultWrite(VAULT); }catch(_){} }
    btn.disabled=false; btn.textContent='دخول';
    if(/Email not confirmed/i.test(String(e.message||''))){ const pi=localGet(PENDING_INVITE)||{}; return screenAwaitConfirm(mail,INVITE_TOKEN||pi.token||''); }
    gErr(u&&u.lockUntil>Date.now()?'محاولات خاطئة متكررة — قُفل الحساب 5 دقائق.':authMessage(e.message));
  }
}

================================================================== */
function setSave(t,w,busy){ $('#saveTxt').textContent=t; $('#saveDot').className='dot'+(w?' warn':(busy?' busy':'')); }
let saveVersion=0,savedVersion=0;
function save(){ saveVersion++;clearTimeout(saveTimer); setSave('جارٍ الحفظ…',false,true); saveTimer=setTimeout(persist,250); }
let persisting=false, persistChain=Promise.resolve(true);
function persist(){
  const run=async()=>{
    if(!DEK||!DB) return false;
    const targetVersion=saveVersion,started=Date.now();
    persisting=true;
    try{
      VAULT.data=await encObj(DEK,DB);
      const expectedRev=MYREV;VAULT.rev=expectedRev+1; VAULT.updatedAt=nowTs();
      if(!(await vaultWrite(VAULT,expectedRev))){const remote=await vaultRead();return conflict(remote)||false}MYREV=VAULT.rev;
      savedVersion=Math.max(savedVersion,targetVersion);
      const sz=vaultSize(VAULT),seconds=(Date.now()-started)/1000; $('#sizeTxt').textContent=fmtSize(sz); $('#sizeTxt').title='حجم البيانات المشفرة المحفوظة';
      setSave(sz>4000000?`محفوظ · ${seconds.toFixed(1)}ث · اقترب حد المساحة`:`محفوظ · ${seconds.toFixed(1)}ث`,sz>4000000);
      return true;
    }catch(e){ setSave('تعذّر الحفظ — نزّل نسخة احتياطية',true); return false; }
    finally{ persisting=false; }
  };
  persistChain=persistChain.then(run,run);
  return persistChain;
}
async function commitNow(){
  saveVersion++; clearTimeout(saveTimer); setSave('جارٍ الحفظ…',false,true);
  return persist();
}
async function flushPendingSave(){
  clearTimeout(saveTimer);
  if(savedVersion<saveVersion&&!persisting) await persist();
  while(persisting) await new Promise(r=>setTimeout(r,40));
  if(savedVersion<saveVersion) await persist();
  return savedVersion>=saveVersion;
}
function conflict(remote){
  setSave('تعارض في الحفظ',true);
  modal('تحديث من مستخدم آخر',
    `<p style="margin:0 0 8px;font-size:14px">حُدّثت البيانات من جهاز أو مستخدم آخر بعد آخر مزامنة لديك.</p>
     <p style="margin:0;font-size:13px;color:var(--ink-3)">اختر: إعادة التحميل (تفقد تعديلك الحالي غير المحفوظ) أو الكتابة فوق نسخته.</p>`,
    `<button class="btn primary" id="cfR">إعادة التحميل من الخادم</button>
     <button class="btn danger" id="cfO">الكتابة فوق النسخة الأخرى</button>`,'sm');
  $('#cfR').onclick=async()=>{ closeModal(); VAULT=remote; try{ DB=await decObj(DEK,VAULT.data); MYREV=VAULT.rev;
      ME=(DB.users||[]).find(x=>x.id===ME.id)||ME; render(); setSave('محفوظ'); toast('حُدّثت البيانات'); }
    catch(e){ toast('تعذّر فك التشفير — سجّل الدخول من جديد','err'); logout(); } };
  $('#cfO').onclick=async()=>{ closeModal(); MYREV=remote.rev; VAULT.rev=remote.rev; await persist(); };
}
async function syncNow(){
  const remote=await vaultRead(); if(!remote) return toast('لا يوجد اتصال بالبيانات','err');
  if(remote.rev===MYREV) return toast('البيانات محدّثة');
  try{ VAULT=remote; DB=await decObj(DEK,VAULT.data); MYREV=VAULT.rev;
    ME=(DB.users||[]).find(x=>x.id===ME.id)||ME; render(); toast('تمت المزامنة'); }
  catch(e){ toast('تعذّرت المزامنة','err'); }
}
async function syncQuietly(){
  if(!ME||!DEK||persisting||document.hidden) return;
  try{
    const rev=await vaultRevision();if(!rev||rev<=MYREV)return;
    const remote=await vaultRead();if(!remote||remote.rev<=MYREV)return;
    VAULT=remote; DB=await decObj(DEK,VAULT.data); MYREV=VAULT.rev;
    ME=(DB.users||[]).find(x=>x.id===ME.id)||ME;
    const stillVisible=cur&&visiblePages().some(p=>p.id===cur);
    if(cur&&!stillVisible) cur=null;
    render(); setSave('تمت المزامنة تلقائياً');
  }catch(e){ /* تبقى المزامنة اليدوية متاحة عند انقطاع الشبكة */ }
}
window.addEventListener('focus',syncQuietly);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncQuietly(); });
setInterval(syncQuietly,30000);

const MAXDIM=520, QUALITY=.68, MAXFILE=200*1024*1024, FILE_BUCKET='workspace-files';
function compressImage(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader(); fr.onerror=()=>rej(new Error('read'));
    fr.onload=()=>{ const im=new Image(); im.onerror=()=>rej(new Error('decode'));
      im.onload=()=>{ let w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
        const s=Math.min(1,MAXDIM/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx=cv.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,w,h); cx.drawImage(im,0,0,w,h);
        try{const webp=cv.toDataURL('image/webp',QUALITY);res(webp.startsWith('data:image/webp')?webp:cv.toDataURL('image/jpeg',QUALITY))}catch(e){ rej(e); } };
      im.src=fr.result; };
    fr.readAsDataURL(file);
  });
}
const readAsDataURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});

  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},10000); }

async function previewPdfMobile(url,name){
  const id='pdfPage_'+Date.now();
  const key=Date.now();
  modal('معاينة PDF — '+esc(name),`<div class="pdf-pages" id="${id}"><div class="pdf-preview-loading">جارٍ تجهيز الملف…</div></div>`,`<div class="pdf-controls"><button class="btn ghost" id="pdfPrev${key}">السابق</button><span class="pdf-count" id="pdfCount${key}">—</span><button class="btn ghost" id="pdfNext${key}">التالي</button><button class="btn ghost" id="pdfMinus${key}" title="تصغير">−</button><button class="btn ghost" id="pdfPlus${key}" title="تكبير">＋</button><button class="btn ghost" onclick="closeModal()">إغلاق</button></div>`,'lg');
  if(!(await ensurePdf())) throw new Error('pdf viewer unavailable');
  const pdf=await window.pdfjsLib.getDocument({url}).promise;
  const box=document.getElementById(id);
  if(!box) return;
  let current=1,zoom=1,rendering=false,pending=false;
  const count=document.getElementById('pdfCount'+key),prev=document.getElementById('pdfPrev'+key),next=document.getElementById('pdfNext'+key);
  async function draw(){
    if(rendering){pending=true;return} rendering=true;
    const page=await pdf.getPage(current),base=page.getViewport({scale:1});
    if(!document.getElementById(id)){rendering=false;return}
    const fit=Math.max(280,Math.min(box.clientWidth-22,760))/base.width,density=Math.min(window.devicePixelRatio||1,2);
    const cssScale=fit*zoom,viewport=page.getViewport({scale:cssScale*density}),canvas=document.createElement('canvas'),wrap=document.createElement('div');
    wrap.className='pdf-page';canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);

function prepareWelcomeImage(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith('image/')) return reject(new Error('اختر ملف صورة صالحاً'));
    if(file.size>30*1024*1024) return reject(new Error('حجم الصورة الأصلية أكبر من 30 م.ب'));
    const rd=new FileReader();
    rd.onerror=()=>reject(new Error('تعذرت قراءة الصورة'));
    rd.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('تعذرت معالجة الصورة'));im.onload=()=>{
      const max=1280,scale=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale));
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(im,0,0,w,h);
      let quality=.78,out=cv.toDataURL('image/webp',quality);if(!out.startsWith('data:image/webp'))out=cv.toDataURL('image/jpeg',quality);while(out.length>750000&&quality>.42){quality-=.07;out=cv.toDataURL(out.startsWith('data:image/webp')?'image/webp':'image/jpeg',quality)}
      resolve(out);
    };im.src=rd.result};rd.readAsDataURL(file);
  });
}

function pickFiles(cid,kind){
  const inp=document.createElement('input'); inp.type='file';
  inp.accept = kind==='fil'?'application/pdf,image/*':'image/*';
  if(kind!=='img') inp.multiple=true;
  inp.onchange=()=>handleFiles(cid,Array.from(inp.files||[]),kind); inp.click();
}
async function handleFiles(cid,files,kind){
  if(!files.length) return;
  try{
    if(kind==='img'){ const im=files.find(f=>f.type.startsWith('image/')); if(!im) return toast('اختر صورة','err');
      IMGB[cid]=await compressImage(im); drawImg(cid); toast('أُضيفت الصورة'); return; }
    if(kind==='gal'){ const ims=files.filter(f=>f.type.startsWith('image/')); if(!ims.length) return toast('اختر صوراً','err');
      GALB[cid]=GALB[cid]||[]; for(const f of ims.slice(0,12)) GALB[cid].push(await compressImage(f));
      drawGal(cid); toast('أُضيفت الصور'); return; }
    FILB[cid]=FILB[cid]||[];
    let skipped=0;
    for(const f of files.slice(0,10)){
      const ext=(f.name.split('.').pop()||'').toLowerCase();
      const ok = f.type==='application/pdf'||f.type==='application/x-pdf'||f.type==='application/octet-stream'||ext==='pdf'||f.type.startsWith('image/');
      if(!ok){ skipped++; continue; }
      if(f.size>MAXFILE){ skipped++; continue; }
      if(!SB_SESSION) await cloudSession(); const wid=await workspaceId();
      const safeExt=/^[a-z0-9]{1,8}$/.test(ext)?ext:(f.type.startsWith('image/')?'jpg':'pdf');
      const path=`${wid}/${Date.now()}-${uid()}.${safeExt}`;
      await uploadStoredFile(path,f);
      FILB[cid].push({n:f.name,t:f.type,s:f.size,path});
    }
    drawFil(cid);
    toast(skipped?`أُضيفت الملفات · تُخطّي ${skipped} (نوع غير مدعوم أو حجم كبير)`:'أُضيفت الملفات');
  }catch(e){ toast('تعذّر رفع الملف: '+(e.message||'تحقق من الاتصال وحجم الملف'),'err'); }
}

}

function readField(c){

  const e=document.getElementById('f_'+c.id); if(!e) return undefined;

function normUnique(v){
  return String(v??'').trim().toLowerCase().replace(/[٠-٩]/g,d=>'0123456789'['٠١٢٣٤٥٦٧٨٩'.indexOf(d)]).replace(/\s+/g,' ');

async function saveRow(rid){
  const p=pg(), V={};
  for(const c of p.cols){ const v=readField(c); if(v!==undefined) V[c.id]=v; }
  const pc=primary(p);
  if(!String(V[pc.id]||'').trim()){ const el=document.getElementById('f_'+pc.id); if(el){el.classList.add('bad');el.focus();}
    return toast(`«${pc.name}» مطلوب`,'err'); }
  for(const c of p.cols){ if(c.required){ const x=V[c.id]; if(!(Array.isArray(x)?x.length:String(x||'').length)) return toast(`«${c.name}» مطلوب`,'err'); } }
  for(const c of p.cols.filter(x=>x.type==='hijri')){ const v=V[c.id];
    if(v&&!/^1[34]\d{2}\/(0?[1-9]|1[0-2])\/(0?[1-9]|[12]\d|30)$/.test(v)) return toast(`صيغة «${c.name}» غير صحيحة؛ استخدم 1448/04/02`,'err'); }
  for(const c of p.cols.filter(x=>x.unique)){
    const val=normUnique(V[c.id]); if(!val) continue;
    if(p.rows.some(row=>row.id!==rid&&normUnique(row.v[c.id])===val)){
      const el=document.getElementById('f_'+c.id); if(el){el.classList.add('bad');el.focus();}
      return toast(`القيمة في «${c.name}» مسجلة مسبقاً في هذه الصفحة`,'err');
    }
  }
  const oldRows=JSON.parse(JSON.stringify(p.rows)), oldAudit=(DB.audit||[]).slice();
  if(rid){ const r=p.rows.find(x=>x.id===rid);
    if(p.logCol&&V[p.logCol]&&V[p.logCol]!==r.v[p.logCol]){ r.log=r.log||[]; r.log.unshift({at:nowTs(),tx:V[p.logCol],by:ME.name}); }

  const btn=$('#bSaveRow'); if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> جارٍ الحفظ…';}
  const ok=await commitNow();
  if(!ok){p.rows=oldRows;DB.audit=oldAudit;if(btn){btn.disabled=false;btn.textContent=rid?'حفظ التعديلات':'إضافة';}return toast('تعذّر حفظ التعديل. لم تُغلق النافذة حتى لا تفقد بياناتك؛ تحقق من الاتصال وحاول مجددًا','err');}
  closeModal(); render(); toast(rid?'حُفظت التعديلات وتأكدت مزامنتها':'أُضيف السجل وتأكد حفظه');
}

function guessCol(name,peopleId,isLetters){

  if(t==='القسم') return col(t,'select',{filterable:true,options:[{label:'القيادة',color:'gold'},{label:'شؤون الأفراد',color:'teal'},{label:'العمليات',color:'blue'},{label:'التدريب',color:'plum'},{label:'الإمداد والتموين',color:'amber'},{label:'الاتصالات',color:'green'},{label:'الخدمات الطبية',color:'red'},{label:'الأمن والحماية',color:'slate'}]});
  if(['القوة المعتمدة','الموجود الفعلي','الشاغر','المجمّد','المكلّف داخلياً','المكلّف خارجياً','في إجازة','النقص','الزيادة','نسبة الإنجاز','عدد أيام التأخير'].includes(t)) return col(t,'number');

  if(peopleId&&h('اسم الفرد','صاحب المعاملة','المستلم','المرشح','المرشَّح','السائق','الموظف','المسؤول','المنسوب','المستفيد'))

function buildPage(name,sub,ico,acc,view,names){
  const peo=DB.pages.find(x=>x.avatars)||DB.pages[0], isL=view==='letters';
  const cols=names.map(n=>guessCol(n,peo?peo.id:'',isL));
  if(isL&&!cols.some(c=>c.type==='longtext')) cols.push(col('صيغة الخطاب','longtext'));
  const st=cols.find(c=>c.type==='select'&&/حالة|الوضع/.test(c.name));
  const lg=cols.find(c=>/آخر إجراء|ملاحظات/.test(c.name)&&c.type==='longtext');
  const tgt=DB.pages.find(x=>x.logCol);
  return {id:uid(),name,sub,icon:ico,accent:acc,view,
    avatars:!!(cols.find(c=>c.type==='image'&&c.hidden))||/اسم/.test(names[0]||''),
    showUpdated:!!st,chipsCol:st?st.id:'',logCol:lg?lg.id:'',peoplePage:peo?peo.id:'',targetPage:tgt?tgt.id:'',showPhoto:true,cols,rows:[]};
}

let IMP={p:null,rows:[],head:true};
function pickImport(p){
  if(!canImport(p)) return toast('ليس لديك صلاحية الاستيراد','err');
  const inp=$('#fileIn'); inp.accept='.csv,.xlsx,.xls,text/csv';
  inp.onchange=async()=>{ const f=inp.files[0]; inp.value=''; if(!f) return;
    try{
      let rows;
      if(/\.(xlsx|xls)$/i.test(f.name)){
        toast('جارٍ تجهيز قارئ Excel…');
        if(!(await ensureXLSX())){ return toast('محرّك Excel غير متاح — احفظ الملف بصيغة CSV واستورده','err'); }
        const buf=await f.arrayBuffer();
        const wb=XLSX.read(new Uint8Array(buf),{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''});
      } else {
        const txt=await f.text(); rows=parseCSV(txt);
      }
      rows=rows.filter(r=>r.some(x=>String(x??'').trim()!==''));
      if(!rows.length) return toast('الملف فارغ','err');
      IMP={p,rows,head:true}; showImport();
    }catch(e){ toast('تعذّرت قراءة الملف','err'); } };
  inp.click();
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');
  const first=text.split('\n')[0]||'';
  const sep=(first.split(';').length>first.split(',').length)?';':',';
  const out=[]; let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else { if(c==='"') q=true;
      else if(c===sep){ row.push(cell); cell=''; }
      else if(c==='\n'){ row.push(cell); out.push(row); row=[]; cell=''; }
      else if(c!=='\r') cell+=c; } }
  if(cell.length||row.length){ row.push(cell); out.push(row); }
  return out;
}
function showImport(){
  const p=IMP.p, hdr=IMP.head?IMP.rows[0]:IMP.rows[0].map((_,i)=>'العمود '+(i+1));
  const data=IMP.head?IMP.rows.slice(1):IMP.rows;
  const norm=s=>String(s||'').replace(/\s+/g,'').toLowerCase();

  modal('استيراد من Excel — '+esc(p.name),`
    <label style="display:flex;gap:7px;align-items:center;font-size:13.5px;font-weight:700;margin-bottom:12px">

    <div class="permgrid">${hdr.map((h,i)=>`<div class="permrow"><span>${esc(h||'العمود '+(i+1))}</span>
      <select data-map="${i}"><option value="">تجاهل</option>
        ${p.cols.filter(c=>!['image','gallery','files'].includes(c.type)).map(c=>`<option value="${c.id}" ${guess(h)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
      </select></div>`).join('')}</div>
    <div style="margin-top:14px;padding:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;font-size:12.5px;color:var(--ink-2)">
      عدد الصفوف الجاهزة للاستيراد: <b>${data.length}</b> · الصور والملفات لا تُستورد من Excel وتُضاف يدوياً بعد ذلك.</div>`,
    `<button class="btn primary" id="imGo">استيراد ${data.length} سجل</button><button class="btn ghost" onclick="closeModal()">إلغاء</button>`,'lg');
  $('#imHead').onchange=e=>{ IMP.head=e.target.checked; showImport(); };
  $('#imGo').onclick=()=>{
    const map={}; document.querySelectorAll('[data-map]').forEach(s=>{ if(s.value) map[+s.dataset.map]=s.value; });
    if(!Object.keys(map).length) return toast('اربط عموداً واحداً على الأقل','err');
    const pc=primary(p); let n=0, skipped=0;
    data.forEach(r=>{
      const V={};
      Object.entries(map).forEach(([i,cid])=>{
        const c=p.cols.find(x=>x.id===cid); let val=String(r[+i]??'').trim();
        if(c.type==='list') V[cid]=val?val.split(/[،,;|]/).map(s=>s.trim()).filter(Boolean):[];
        else if(c.type==='select'){ const o=(c.options||[]).find(o=>o.label===val); V[cid]=o?o.label:val; }
        else if(c.type==='link'){ const t=linkPage(c); const m=t.rows.find(x=>rowTitle(t,x)===val); V[cid]=m?m.id:''; }
        else if(c.type==='date'){ const d=new Date(val); V[cid]=isNaN(d)?'':d.toISOString().slice(0,10); }
        else V[cid]=val;
      });
      if(!String(V[pc.id]||'').trim()){ skipped++; return; }
      const duplicate=p.cols.filter(c=>c.unique).some(c=>{
        const val=normUnique(V[c.id]); return val&&p.rows.some(x=>normUnique(x.v[c.id])===val);
      });
      if(duplicate){ skipped++; return; }
      p.rows.push({id:uid(),v:V,log:[],created:todayISO(),updated:todayISO()}); n++;
    });
    audit('استيراد Excel',p.name+' · '+n+' سجل');
    save(); closeModal(); render();
    toast(skipped?`استُورد ${n} سجل · تُخطّي ${skipped} (ناقص أو مكرر)`:`استُورد ${n} سجل بنجاح`);
  };
}

function exportCSV(p){
  if(!canExport()) return toast('ليس لديك صلاحية التصدير','err');
  const cols=vis(p), head=['م',...cols.map(c=>c.name)]; if(p.showUpdated) head.push('آخر تحديث');
  const rows=rowsOf(p).map((r,i)=>{const a=[i+1,...cols.map(c=>
      c.type==='image'?(r.v[c.id]?'يوجد صورة':''):c.type==='gallery'?((r.v[c.id]||[]).length?((r.v[c.id]||[]).length+' صور'):''):cellText(p,c,r))];
    if(p.showUpdated) a.push(fmtDate(r.updated)); return a;});
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  download(p.name+'.csv','\uFEFF'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
  audit('تصدير',p.name); toast('نُزّل الملف — يفتح في Excel مباشرة');
}

     <p style="font-size:13.5px;margin:0 0 12px">اختر ملف خزنة (<b>.vault.json</b>) أو ملف بيانات (<b>.json</b>).</p>
     <button class="btn primary" id="rsPick" style="width:100%;justify-content:center">اختيار الملف</button>`,
    `<button class="btn ghost" onclick="closeModal()">إلغاء</button>`,'sm');
  $('#rsPick').onclick=()=>{
    const inp=$('#fileIn'); inp.accept='application/json,.json';
    inp.onchange=()=>{ const f=inp.files[0]; inp.value=''; if(!f) return;
      const rd=new FileReader();
      rd.onload=async()=>{
        let d; try{ d=JSON.parse(rd.result); }catch(e){ return toast('الملف غير صالح','err'); }
        if(d&&d.v===3&&d.users&&d.data){
          ask('استعادة خزنة كاملة؟ ستُستبدل كل البيانات والحسابات، وستحتاج لتسجيل الدخول من جديد.',async()=>{
            try{ await vaultWrite(d); toast('استُعيدت الخزنة — سجّل الدخول'); setTimeout(()=>location.reload(),900); }
            catch(e){ toast('تعذّرت الكتابة','err'); } },'استعادة');
          return;
        }
        let nd=null;
        if(d&&Array.isArray(d.pages)) nd=d;
        else if(d&&Array.isArray(d.personnel)) return toast('هذا ملف من إصدار قديم جداً غير مدعوم هنا','err');
        if(!nd) return toast('الملف غير معروف','err');
        ask(`استعادة ${nd.pages.length} صفحة؟ ستُستبدل بيانات الصفحات الحالية (الحسابات تبقى كما هي).`,async()=>{
          DB.unit=nd.unit||DB.unit; DB.pages=nd.pages;
          if(Array.isArray(nd.users)&&nd.users.length){
            const ids=new Set(VAULT.users.map(u=>u.id));
            DB.users=nd.users.filter(u=>ids.has(u.id));
            if(!DB.users.find(u=>u.id===ME.id)) DB.users.push(ME);
            ME=DB.users.find(u=>u.id===ME.id);
          }
          DB.audit=nd.audit||DB.audit||[];
          audit('استعادة','ملف بيانات');
          ui={}; cur=null;
          await persist(); enterApp(); toast('استُعيدت البيانات'); },'استعادة');
      };
      rd.readAsText(f); };
    inp.click();
  };
}
$('#unitName').addEventListener('input',e=>{ if(!isAdmin()) return; DB.unit=e.target.value; save();
  const p=pg(); if(p&&p.view==='letters'&&U().mode==='letter') drawSheet(p); });
$('#scrim').onclick=()=>{$('#side').classList.remove('open');$('#scrim').classList.remove('on');};

boot();
</script>
</body>
</html>
